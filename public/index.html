<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatwoot → Supabase</title><style>body{font:16px system-ui;max-width:850px;margin:50px auto;padding:16px;background:#f7f8f6;color:#29352a}main{background:white;padding:26px;border-radius:14px;box-shadow:0 4px 22px #0001}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;margin:7px 0 15px;padding:12px;border:1px solid #aaa;border-radius:7px}textarea{min-height:180px;font:13px monospace}button{background:#536945;color:white;cursor:pointer;border:none}pre{white-space:pre-wrap}</style></head><body><main><h1>Chatwoot → Supabase</h1><p>Importação manual de relatórios já normalizados. Eventos nativos entram por <code>/api/webhook</code>.</p><label>SYNC_TOKEN <input type="password" id="token" autocomplete="off"></label><label>Relatórios JSON <textarea id="json">{"agent_report":[],"label_report":[],"conversation_traffic":[],"resolution_heatmap":[]}</textarea></label><button id="run">Atualizar tabelas</button><pre id="result"></pre></main><script>document.getElementById('run').onclick=async()=>{const result=document.getElementById('result');result.textContent='Enviando...';try{const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json','x-sync-token':document.getElementById('token').value},body:document.getElementById('json').value});const data=await r.json();result.textContent=JSON.stringify(data,null,2);}catch(e){result.textContent=String(e)}};</script></body></html>
